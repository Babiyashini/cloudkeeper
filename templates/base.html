<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudKeeper — {{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="ck-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="ck-sidebar">
      <div class="ck-brand">
        <div class="ck-brand-icon"><i class="fa-solid fa-cloud"></i></div>
        <span>CloudKeeper</span>
      </div>

      <nav class="ck-nav">
        <a class="ck-nav-link {% if title == 'Dashboard' %}active{% endif %}" href="/">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a class="ck-nav-link {% if title == 'Resources' %}active{% endif %}" href="/resources">
          <i class="fa-solid fa-server"></i> Resources
        </a>
        <a class="ck-nav-link {% if title == 'Recommendations' %}active{% endif %}" href="/recommendations">
          <i class="fa-solid fa-lightbulb"></i> Recommendations
        </a>
        <a class="ck-nav-link {% if title == 'Reports' %}active{% endif %}" href="/reports">
          <i class="fa-solid fa-file-lines"></i> Reports
        </a>
      </nav>

      <div class="ck-sidebar-footer">
        <div>FinOps · Multi-cloud</div>
        <div><strong>v0.2.0</strong> · Oct 2026</div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="ck-main">
      <header class="ck-topbar">
        <div>
          <h1 class="ck-page-title">{{ title }}</h1>
          <p class="ck-page-sub">Cloud FinOps &amp; Cost Monitoring Dashboard</p>
        </div>
        <div class="ck-topbar-meta">
          <span class="ck-chip"><i class="fa-solid fa-calendar"></i> <strong>Oct 2026</strong></span>
          <span class="ck-chip"><i class="fa-solid fa-circle-check text-success"></i> <strong>3 clouds</strong></span>
          <div class="ck-avatar">Y</div>
        </div>
      </header>

      <main class="ck-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
</body>
</html>
