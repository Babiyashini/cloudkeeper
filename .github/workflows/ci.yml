name: CI — Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: cloudkeeper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name ck-ci -p 5000:5000 \
            -v "$PWD/data:/app/data" \
            -v "$PWD/templates:/app/templates" \
            -v "$PWD/static:/app/static" \
            cloudkeeper:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "/health is up"; break
            fi
            echo "waiting ($i/30)..."; sleep 1
          done

      - name: Smoke test - /health
        run: |
          response=$(curl -sf http://localhost:5000/health)
          echo "$response" | grep -q '"status":"ok"' || exit 1

      - name: Smoke test - /api/costs/summary
        run: |
          response=$(curl -sf http://localhost:5000/api/costs/summary)
          echo "$response" | grep -q '"grand_total"' || exit 1
          echo "$response" | grep -q '"AWS"' || exit 1

      - name: Smoke test - /api/alerts
        run: |
          response=$(curl -sf http://localhost:5000/api/alerts)
          echo "$response" | grep -q '"alerts"' || exit 1

      - name: Smoke test - all 4 HTML pages
        run: |
          for path in / /resources /recommendations /reports; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Container logs (on failure)
        if: failure()
        run: docker logs ck-ci

      - name: Stop container
        if: always()
        run: docker stop ck-ci || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max